name: Update Mion order data

on:
  schedule:
    # 09:30 Europe/Istanbul (UTC+3)
    - cron: "30 6 * * *"
  push:
    paths:
      - ".github/workflows/update-mion-orders.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date to refresh (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-mion-orders
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    env:
      TARGET_DATE: ${{ inputs.date }}
      TARGET_DATES: ${{ github.event_name == 'push' && '2026-11-12,2026-11-13' || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch Mion totals
        run: python3 .github/scripts/update_mion_orders.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/orders.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orders.json
          git commit -m "Update daily Mion order data"
          git push
