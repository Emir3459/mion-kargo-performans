name: Update Mion order data

on:
  schedule:
    # 09:30 Europe/Istanbul (UTC+3)
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date to refresh (YYYY-MM-DD)"
        required: false
        type: string
  push:
    paths:
      - ".github/workflows/update-mion-orders.yml"
      - ".github/scripts/update_mion_orders.py"

permissions:
  contents: write

concurrency:
  group: update-mion-orders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_DATE: ${{ inputs.date }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch previous-day Mion total
        run: python .github/scripts/update_mion_orders.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/orders.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orders.json
          git commit -m "Update daily Mion order data"
          git push
