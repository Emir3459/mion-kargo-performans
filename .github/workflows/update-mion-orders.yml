name: Update Mion order data

on:
  schedule:
    # Every hour on the hour; cron uses UTC.
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths: ['.github/workflows/update-mion-orders.yml']
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date to refresh (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-mion-orders
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    env:
      TARGET_DATES: ${{ github.event_name == 'push' && '2026-11-01,2026-11-02,2026-11-03,2026-11-04,2026-11-05,2026-11-06,2026-11-07,2026-11-08,2026-11-09,2026-11-10,2026-11-11,2026-11-12,2026-11-13,2026-11-14,2026-11-15,2026-11-16,2026-11-17,2026-11-18' || '' }}
      TARGET_DATE: ${{ inputs.date }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Recheck recent Mion totals
        run: python3 .github/scripts/update_mion_orders.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/orders.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orders.json
          git commit -m "Update daily Mion order data"
          git push
