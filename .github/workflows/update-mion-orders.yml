name: Update Mion order data

on:
  schedule:
    # Every 15 minutes; offset avoids the top-of-hour scheduling peak.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date to refresh (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-mion-orders
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    env:
      TARGET_DATE: ${{ inputs.date }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Recheck recent Mion totals
        run: python3 .github/scripts/update_mion_orders.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/orders.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orders.json
          git commit -m "Update daily Mion order data"
          git push
